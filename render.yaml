# FastAPI on Render. WebSockets stay up for the length of a call.
# The Next.js desk stays on Vercel and points here with NEXT_PUBLIC_API_BASE
# and NEXT_PUBLIC_WS_BASE.
services:
  - type: web
    name: janvaani-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: GNANI_API_KEY
        sync: false
      - key: GNANI_BASE_URL
        value: https://api.vachana.ai
      - key: GNANI_TTS_MODEL
        value: timbre-v3.0
      - key: GNANI_TTS_VOICE
        value: Shivani
      - key: GNANI_TTS_VOICE_EN
        sync: false
      - key: GNANI_TTS_SPEED
        value: "0.92"
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: llama-3.1-8b-instant
      - key: LLM_ENABLED
        value: auto
